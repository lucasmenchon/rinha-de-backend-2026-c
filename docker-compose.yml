services:
  lb:
    image: "lucasmenchon/rinha-de-backend-2026-c:fast-lb-api-opt-20260519-4"
    command: ["/app/lb"]
    platform: linux/amd64
    user: root
    environment:
      PORT: "9999"
      UPSTREAMS: "/run/rinha/api1.sock,/run/rinha/api2.sock"
      BACKLOG: "65535"
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    volumes:
      - sockets:/run/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.04"
          memory: "20M"

  api1:
    image: "lucasmenchon/rinha-de-backend-2026-c:fast-lb-api-opt-20260519-4"
    command: ["/app/api"]
    platform: linux/amd64
    user: root
    environment:
      API_FD_SOCK: "/run/rinha/api1.sock"
      API_FD_SOCKET_TYPE: "stream"
      API_MLOCKALL: "1"
      INDEX_PATH: "/app/resources/index.bin"
      INDEX_MAP_POPULATE: "1"
      INDEX_MLOCK: "1"
      INDEX_WARM_PAGES: "1"
      INDEX_NPROBE: "3"
      INDEX_REPAIR_NPROBE: "18"
      INDEX_REPAIR_MIN_FRAUD: "1"
      INDEX_REPAIR_MAX_FRAUD: "4"
      INDEX_REPAIR0_WORST_THRESHOLD: "4021242"
      INDEX_REPAIR5_WORST_THRESHOLD: "3748534"
      INDEX_EXACT_FALLBACK: "1"
      INDEX_EARLY_DISTANCE_MILLI: "159"
      BUCKET_PROFILE_FASTPATH: "1"
      BUCKET_PROFILE_LEGIT_MIN_COUNT: "15"
      BUCKET_PROFILE_FRAUD_MIN_COUNT: "15"
      BUCKET_REFERENCE_FASTPATH: "1"
      BUCKET_REFERENCE_FASTPATH_LEGIT: "0"
      BUCKET_REFERENCE_FASTPATH_FRAUD: "1"
      BUCKET_REFERENCE_FASTPATH2_LEGIT: "0"
      BUCKET_REFERENCE_FASTPATH2_FRAUD: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - sockets:/run/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "165M"

  api2:
    image: "lucasmenchon/rinha-de-backend-2026-c:fast-lb-api-opt-20260519-4"
    command: ["/app/api"]
    platform: linux/amd64
    user: root
    environment:
      API_FD_SOCK: "/run/rinha/api2.sock"
      API_FD_SOCKET_TYPE: "stream"
      API_MLOCKALL: "1"
      INDEX_PATH: "/app/resources/index.bin"
      INDEX_MAP_POPULATE: "1"
      INDEX_MLOCK: "1"
      INDEX_WARM_PAGES: "1"
      INDEX_NPROBE: "3"
      INDEX_REPAIR_NPROBE: "18"
      INDEX_REPAIR_MIN_FRAUD: "1"
      INDEX_REPAIR_MAX_FRAUD: "4"
      INDEX_REPAIR0_WORST_THRESHOLD: "4021242"
      INDEX_REPAIR5_WORST_THRESHOLD: "3748534"
      INDEX_EXACT_FALLBACK: "1"
      INDEX_EARLY_DISTANCE_MILLI: "159"
      BUCKET_PROFILE_FASTPATH: "1"
      BUCKET_PROFILE_LEGIT_MIN_COUNT: "15"
      BUCKET_PROFILE_FRAUD_MIN_COUNT: "15"
      BUCKET_REFERENCE_FASTPATH: "1"
      BUCKET_REFERENCE_FASTPATH_LEGIT: "0"
      BUCKET_REFERENCE_FASTPATH_FRAUD: "1"
      BUCKET_REFERENCE_FASTPATH2_LEGIT: "0"
      BUCKET_REFERENCE_FASTPATH2_FRAUD: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - sockets:/run/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "165M"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
